<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
    }
    .container {
      width: 80%;
      margin: 0 auto;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    .header {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .content {
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">Expense Tracker Notification</div>
    <div class="content">
      <p>Hello,</p>
      <p>{{message}}</p>
      <p>Thank you,</p>
      <p>The Expense Tracker Team</p>
    </div>
  </div>
</body>
</html>
